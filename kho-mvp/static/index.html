<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#C8F03C">
<title>Kho Nông Sản Xanh</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{
  --bg:#F3F6EE;--surface:#fff;--surface2:#EAF0E2;--ink:#12261B;--muted:#56685C;--line:#DCE5D3;
  --lime:#C8F03C;--on-lime:#12261B;--edge:#12261B;
  --green:#0B7A3E;--green-soft:#D9F2E0;--amber:#8A5A00;--amber-soft:#FFEBB5;
  --red:#C23A1B;--red-soft:#FFDDD3;--blue:#1F5F8B;--blue-soft:#D8EAF6;
  --shadow:0 1px 2px rgba(18,38,27,.05),0 8px 24px -12px rgba(18,38,27,.18);
  --r:18px;
}
:root[data-theme="dark"]{
  --bg:#0C1710;--surface:#14241A;--surface2:#1C3024;--ink:#EDF5E8;--muted:#9DB3A3;--line:#26402E;--edge:#000;
  --green:#5FD38A;--green-soft:#16422A;--amber:#FFCB5C;--amber-soft:#3A2D0B;--red:#FF8A6B;--red-soft:#4A1E14;--blue:#7CC0EE;--blue-soft:#12354D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1710;--surface:#14241A;--surface2:#1C3024;--ink:#EDF5E8;--muted:#9DB3A3;--line:#26402E;--edge:#000;
  --green:#5FD38A;--green-soft:#16422A;--amber:#FFCB5C;--amber-soft:#3A2D0B;--red:#FF8A6B;--red-soft:#4A1E14;--blue:#7CC0EE;--blue-soft:#12354D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}

/* ---------- khung ứng dụng ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
nav{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 18px}
.brand img{width:42px;height:42px;display:block}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
nav .links{display:grid;gap:4px}
nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
nav a:hover{background:var(--surface2);color:var(--ink)}
nav a.on{background:var(--lime);color:var(--on-lime);font-weight:700}
nav .sec{padding:14px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.85}
nav .sec:first-child{padding-top:2px}
nav .foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);line-height:1.5}
header{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:18px 28px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header .t{display:flex;align-items:center;gap:12px;min-width:0}
header .mlogo{display:none;width:36px;height:36px}
header h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
header .date{color:var(--muted);font-size:13px;font-weight:500}
header .who{display:flex;gap:10px;align-items:center}
.me{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 14px 4px 4px}
.av{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--on-lime);font-weight:800;display:grid;place-items:center;font-size:14px}
.me span{font-size:13px;line-height:1.2}.me small{display:block;color:var(--muted);font-size:11px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .15s}
.iconbtn:hover{background:var(--surface2)}
#view{padding:4px 28px 40px;display:grid;gap:18px;min-width:0;align-content:start}

/* ---------- thẻ, lưới ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.card h2 .n{background:var(--surface2);color:var(--muted);border-radius:99px;font-size:12px;padding:1px 9px;font-weight:600}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.hello h2{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0}
.hello p{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:60ch}
.hello{padding:6px 2px 2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{border-radius:var(--r);padding:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.kpi .top{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .chipic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--ink)}
.kpi b{font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.kpi b small{font-size:15px;font-weight:700;margin-left:4px;letter-spacing:0}
.kpi span.sub{font-size:12.5px;color:var(--muted)}
.kpi.hero{grid-column:span 2;background:var(--lime);border:2px solid var(--edge);color:var(--on-lime);box-shadow:5px 5px 0 var(--edge)}
.kpi.hero .top,.kpi.hero span.sub{color:rgba(18,38,27,.75)}.kpi.hero .chipic{background:var(--on-lime);color:var(--lime)}.kpi.hero b{font-size:44px}
.kpi.dark.one{grid-column:span 1}.kpi.dark.one b{font-size:24px}.kpi.dark{grid-column:span 2;background:#12261B;border-color:#12261B;color:#fff}
.kpi.dark .top,.kpi.dark span.sub{color:#A9BDAE}.kpi.dark .chipic{background:#24412F;color:var(--lime)}.kpi.dark b{color:var(--lime);font-size:38px}
.kpi.t-warn .chipic{background:var(--amber-soft);color:var(--amber)}.kpi.t-info .chipic{background:var(--blue-soft);color:var(--blue)}.kpi.t-ok .chipic{background:var(--green-soft);color:var(--green)}

/* ---------- bảng ---------- */
.tw{overflow-x:auto;margin:0 -6px;padding:0 6px}table{border-collapse:collapse;width:100%}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}tr.click td:first-child{border-radius:12px 0 0 12px}tr.click td:last-child{border-radius:0 12px 12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 11px 2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--green-soft);color:var(--green)}.warn{background:var(--amber-soft);color:var(--amber)}.bad{background:var(--red-soft);color:var(--red)}.info{background:var(--blue-soft);color:var(--blue)}.mute{background:var(--surface2);color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}

/* ---------- nút, ô nhập ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 18px;cursor:pointer;font-weight:600;transition:transform .12s,box-shadow .12s,background .15s;min-height:40px}
.btn:hover{background:var(--surface2)}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:var(--lime);border:2px solid var(--edge);color:var(--on-lime);font-weight:700;box-shadow:0 3px 0 var(--edge)}
.btn.pri:hover{background:var(--lime);transform:translateY(-1px);box-shadow:0 4px 0 var(--edge)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.btn.bad{color:var(--red);border-color:var(--red);background:transparent}.btn.bad:hover{background:var(--red-soft)}
.btn.sm{padding:5px 13px;font-size:13px;min-height:32px}.btn.sm.pri{box-shadow:0 2px 0 var(--edge)}.btn.sm.pri:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.55;cursor:not-allowed}
textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;width:100%;min-width:0;max-width:100%;min-height:88px;resize:vertical;color:var(--ink);font:inherit;font-weight:500}
textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 18%,transparent)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1.5px solid var(--line);cursor:zoom-in}
.warnbox{background:var(--red-soft);color:var(--red);border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:500}.warnbox ul{margin:6px 0 0;padding-left:18px}
.urgent{background:var(--red-soft);color:var(--red);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;margin-bottom:14px}
input,select{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0;max-width:100%;min-height:44px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 18%,transparent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;align-items:end}
.form label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}.form input,.form select{width:100%;color:var(--ink);font-weight:500}
.search{position:relative}.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}.search input{padding-left:42px}
.note{margin:12px 0 0;font-size:13px;color:var(--muted)}

/* ---------- thanh, cảnh báo ---------- */
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}.bar.warn i{background:#F2A900}.bar.bad i{background:var(--red)}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.cap{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--bg)}.cap .bar{height:14px;margin:10px 0 8px;display:flex}.cap .bar i{border-radius:0}.cap .bar i.pend{background:repeating-linear-gradient(45deg,#F2A900,#F2A900 4px,#FFD66B 4px,#FFD66B 8px)}.bar.bad i:first-child{background:var(--red)}.cap-hint{grid-column:1/-1;margin:0}.cap-hint .chip{white-space:normal}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 84px;gap:12px;align-items:center;margin:12px 0}.hb>b{text-align:right;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:8px;align-items:flex-start}
.alert .ic{margin-top:2px}.alert.warn{background:var(--amber-soft);color:var(--amber)}.alert.bad{background:var(--red-soft);color:var(--red)}
.alert b{color:var(--ink)}.alert .small{color:var(--ink);opacity:.8}
.wh{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--bg)}
.wh .pct{font-size:26px;font-weight:800;letter-spacing:-.02em}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:grid;gap:14px}
.tl li{position:relative}.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--edge)}

/* ---------- trống, tải, lỗi ---------- */
.empty{display:grid;justify-items:center;gap:8px;padding:34px 16px;text-align:center;color:var(--muted)}
.empty .badge{width:60px;height:60px;border-radius:20px;background:var(--surface2);display:grid;place-items:center;color:var(--green)}
.empty b{color:var(--ink);font-size:16px}.empty p{margin:0;max-width:42ch}
.sk{border-radius:var(--r);background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sk 1.3s infinite linear;min-height:110px}
@keyframes sk{to{background-position:-200% 0}}
.hint{background:var(--blue-soft);color:var(--blue);border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:500}

/* ---------- ngăn kéo, thông báo ---------- */
#drawer{position:fixed;inset:0;display:none;z-index:50}#drawer.open{display:block}
#drawer .bk{position:absolute;inset:0;background:rgba(10,18,13,.5);animation:fade .2s}
#drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(540px,100%);background:var(--surface);overflow:auto;padding:24px;animation:slide .25s cubic-bezier(.2,.8,.2,1);border-radius:24px 0 0 24px}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:0}}
.pn h3{font-size:20px;font-weight:800;letter-spacing:-.02em}.pn h4{font-size:15px;margin:22px 0 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:60;max-width:92vw;display:none;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.err{background:var(--red);color:#fff}
#toast.show{display:flex;gap:10px;align-items:center;animation:pop .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translate(-50%,16px);opacity:0}}

/* ---------- vận chuyển ---------- */
#map{height:420px;border-radius:14px;background:var(--surface2);overflow:hidden;z-index:0}
.tcard{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;margin-bottom:10px;background:var(--surface);transition:border-color .15s}
.tcard:hover{border-color:var(--muted)}.tcard.on{border-color:var(--edge);background:var(--lime);color:var(--on-lime)}
.tcard.on .muted{color:rgba(18,38,27,.7)}.tcard.on .bar{background:rgba(18,38,27,.18)}.tcard.on .bar i{background:var(--on-lime)}
.tcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vt{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px}
.linkbox{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:12.5px;word-break:break-all}
.dl{display:grid;grid-template-columns:130px 1fr;gap:10px 12px;margin:0;font-size:14px}.dl dt{color:var(--muted)}.dl dd{margin:0}
.leaflet-container{font-family:inherit}

/* ---------- trang mới: tab, thanh xếp chồng, đường mini, thu hồi ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 18px;font-weight:600;cursor:pointer;min-height:40px}
.tab:hover{background:var(--surface2)}.tab.on{background:var(--lime);border-color:var(--edge);color:var(--on-lime);font-weight:700}
.stk{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2)}.stk i{display:block;height:100%}
.stk .s1{background:var(--green)}.stk .s2{background:#F2A900}.stk .s3{background:var(--line)}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.lgd span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lgd .s1::before{background:var(--green)}.lgd .s2::before{background:#F2A900}.lgd .s3::before{background:var(--line)}
.spark{width:120px;height:34px;display:block}.spark polyline{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.spark circle{fill:var(--green)}
.rc{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--bg)}.rc.open{border-color:#F2A900}
.rc .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.acts select,.acts input{min-height:36px;padding:6px 12px}
.who-row{display:grid;grid-template-columns:minmax(0,1fr) 180px 64px;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.who-row b{text-align:right;font-variant-numeric:tabular-nums}
details.card summary{cursor:pointer;font-weight:700;font-size:16px}
details.card[open] summary{margin-bottom:14px}
.tcard.lot{padding:10px 12px}
.qrbox{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:18px;padding:14px;border:1.5px dashed var(--line);border-radius:18px;background:var(--surface2)}
.qrimg{width:150px;height:150px;flex:none;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}.qrimg svg{width:100%;height:100%;display:block}
.qrinfo{flex:1;min-width:220px}.qrurl{word-break:break-all;margin:6px 0;padding:6px 10px;border-radius:10px;background:var(--surface);font-family:ui-monospace,Menlo,Consolas,monospace}
.qrwarn{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:13px}
@media print{nav,header,.noprint,#toast,#drawer{display:none!important}.shell{display:block}#view{padding:0}body{background:#fff;color:#000}.card{box-shadow:none;break-inside:avoid}}
@media(max-width:900px){.who-row{grid-template-columns:minmax(0,1fr) 110px 52px}}

/* ---------- đăng nhập ---------- */
.lg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);min-height:100vh}
.lg-hero{background:var(--lime);color:var(--on-lime);padding:40px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;position:relative;overflow:hidden}
.lg-hero .brand{padding:0}.lg-hero .brand small{color:rgba(18,38,27,.7)}
.lg-hero h2{font-size:clamp(34px,4.4vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1.04;max-width:13ch;text-wrap:balance}
.lg-hero p{font-size:17px;max-width:44ch;margin:16px 0 0;color:rgba(18,38,27,.82)}
.tem{position:relative;width:min(380px,100%);background:#fff;color:#12261B;border:2px solid #12261B;border-radius:22px;padding:20px 20px 18px;box-shadow:8px 8px 0 #12261B;transform:rotate(-3deg);margin-left:8px}
.tem::before,.tem::after{content:"";position:absolute;top:96px;width:20px;height:20px;border-radius:50%;background:var(--lime);border:2px solid #12261B}
.tem::before{left:-12px;clip-path:inset(0 0 0 50%)}.tem::after{right:-12px;clip-path:inset(0 50% 0 0)}
.tem .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:2px dashed #12261B}
.tem .h small{font-size:12px;font-weight:600;color:#56685C}.tem .h b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.qr{display:grid;grid-template-columns:repeat(9,1fr);gap:1.5px;width:66px;height:66px;flex:none;padding:4px;border:2px solid #12261B;border-radius:8px}
.qr i{background:#12261B;border-radius:1px}.qr i.o{background:transparent}
.tem dl{display:grid;grid-template-columns:86px 1fr;gap:6px 10px;margin:14px 0 0;font-size:13.5px}.tem dt{color:#56685C}.tem dd{margin:0;font-weight:600}

.float .ic{color:var(--lime)}
.lg-form{display:grid;place-items:center;padding:32px 24px;background:var(--bg)}

.role:hover{border-color:var(--edge);transform:translateY(-2px)}.role b{font-size:14px}.role span{font-size:12px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:500}.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  table.st td{display:flex;justify-content:space-between;gap:14px;border:0;padding:5px 0;text-align:right}
  table.st td::before{content:attr(data-l);color:var(--muted);text-align:left;flex:none;font-weight:500}

}

function capHint(cs,wid,qty,sku){var w=cs.filter(function(x){return x.id===wid})[0];if(!w)return"";qty=+qty||0;var left=w.free_kg-qty,after=(w.used_kg+w.pending_kg+qty)/w.capacity_kg*100;if(left<0){var p=META.products.filter(function(x){return x.sku===sku})[0];var alt=cs.filter(function(x){return x.id!==wid&&x.free_kg>=qty&&(!p||(x.temp_max>=p.temp_min&&x.temp_min<=p.temp_max))})[0];return '<span class="chip bad">Vượt sức chứa '+num(-left)+' kg</span> <span class="small">'+(alt?"Gợi ý chuyển sang "+esc(alt.name)+" (còn trống "+num(alt.free_kg)+" kg).":"Gợi ý chuyển sang kho khác còn trống.")+'</span>'}if(after>85)return '<span class="chip warn">Cảnh báo kho sắp đầy (Còn trống '+num(left)+' kg)</span>';return '<span class="chip ok">Đủ sức chứa (Còn trống '+num(left)+' kg)</span>'}

function route(){var h=location.hash.replace("#",""),P=pages(),ok=P.some(function(p){return p[0]===h});PAGE=ok?h:P[0][0];if(!ok&&h){history.replaceState(null,"","#"+PAGE);toast("Vai trò của bạn không có quyền vào mục này, đã chuyển về trang chính.",true)}closeLot();render(true)}

function render(fresh){

/* ---- các trang ---- */
function kpi(cls,icon,label,val,unit,sub){return '<div class="kpi '+cls+'"><div class="top"><div class="chipic">'+ic(icon)+'</div>'+label+'</div><b>'+val+(unit?'<small>'+unit+'</small>':'')+'</b><span class="sub">'+sub+'</span></div>'}
/* Trang Tổng quan: mỗi vai trò chỉ thấy thẻ KPI, cảnh báo và khối thông tin thuộc phạm vi công việc của mình */
var DASH={
 QUAN_LY:{sub:"Cần để ý: ",idle:"Mọi thứ đang ổn, chưa có việc gấp.",kpis:["tong","het","duyet","xe","don","dt"],warn:["het","held","min","near","temp"],chart:true,wh:true},
 KINH_DOANH:{sub:"Việc bán hàng hôm nay: ",idle:"Chưa có đơn nào cần xử lý. Có thể xem kế hoạch mùa vụ để chủ động nguồn cung.",kpis:["dt","don","het","xe_out"],warn:["het","min"],chart:true,wh:false},
 THU_KHO:{sub:"Việc ở kho hôm nay: ",idle:"Chưa có đơn chờ xuất hay xe đang chạy. Kho đang yên.",kpis:["tong","het","xe","don"],warn:["het","near","temp"],chart:false,wh:true},
 QA:{sub:"Việc kiểm định hôm nay: ",idle:"Không có lô nào chờ kiểm định hay bị giữ lại.",kpis:["tong","het","cho_kd"],warn:["held"],chart:false,wh:false}
};
function pgDash(){return api("GET","/api/dashboard").then(function(d){
  var cfg=DASH[ME.role]||DASH.QUAN_LY,has=function(k){return cfg.kpis.indexOf(k)>=0};
  var name=ME.full_name.trim().split(/\s+/).pop(),bits=[];
  if(has("het")&&d.expiring.length)bits.push(d.expiring.length+" lô sắp hết hạn"+(ME.role==="KINH_DOANH"?" (nên ưu tiên đẩy đơn xả hàng theo FEFO)":""));
  if(has("duyet")&&d.pending_receipts)bits.push(d.pending_receipts+" phiếu nhập chờ duyệt");
  if(cfg.warn.indexOf("held")>=0&&d.open_recalls&&ME.role==="QUAN_LY")bits.push(d.open_recalls+" đợt thu hồi đang xử lý");
  if(has("cho_kd")&&d.pending_inspection)bits.push(d.pending_inspection+" lô chờ kiểm định");
  if(ME.role==="QA"&&d.held.some(function(l){return l.qa_status!=="CHO_KIEM_DINH"}))bits.push(d.held.filter(function(l){return l.qa_status!=="CHO_KIEM_DINH"}).length+" lô cách ly hoặc không đạt");
  if(has("xe")&&d.active_trips)bits.push(d.active_trips+" xe đang trên đường ("+d.active_in+" chặng 1, "+d.active_out+" chặng 2)");
  if(has("xe_out")&&d.active_out)bits.push(d.active_out+" xe đang giao tới cửa hàng");
  if(has("don")&&d.open_orders)bits.push(d.open_orders+(ME.role==="THU_KHO"?" đơn chờ xuất kho":" đơn đang xử lý"));
  var title=ME.role==="QUAN_LY"?"Chào "+esc(name)+", hôm nay kho thế nào?":"Chào "+esc(name)+", "+({KINH_DOANH:"đơn hàng hôm nay ra sao?",THU_KHO:"hôm nay kho cần làm gì?",QA:"hôm nay có lô nào cần kiểm định?"}[ME.role]||"chúc một ngày làm việc tốt!");
  var h='<div class="hello"><h2>'+title+'</h2><p>'+(bits.length?cfg.sub+bits.join(", ")+".":cfg.idle)+'</p></div>';
  var K={
   tong:function(hero){return kpi(hero?"hero":"t-ok","box","Tổng tồn kho",num(d.total_kg),"kg","Trải trên "+d.lots+" lô")},
   het:function(){return kpi("t-warn","clock","Lô sắp hết hạn",d.expiring.length,"","Còn từ 3 ngày trở xuống")},
   duyet:function(){return kpi("t-info","inbox","Phiếu chờ duyệt",d.pending_receipts,"","Phiếu nhập kho")},
   xe:function(){return kpi("t-ok","truck","Xe đang giao",d.active_trips,"","Chặng 1: "+d.active_in+" · Chặng 2: "+d.active_out)},
   xe_out:function(){return kpi("t-ok","truck","Xe đang giao cửa hàng",d.active_out,"","Chặng 2 đang chạy")},
   don:function(){return kpi("t-info","cart","Đơn đang xử lý",d.open_orders,"",ME.role==="THU_KHO"?"Chờ xuất kho":"Chưa xuất kho")},
   dt:function(){return kpi(ME.role==="KINH_DOANH"?"dark one":"dark","wallet","Doanh thu",num(d.revenue||0),"₫","Từ các đơn đã xuất kho")},
   cho_kd:function(){return kpi("t-info","shield","Lô chờ kiểm định",d.pending_inspection||0,"","Cần QA kết luận")}
  };
  /* Thẻ rộng 2 cột: Tổng tồn kho (hero) của Quản lý kho và QA; Doanh thu luôn rộng 2 cột. Mỗi vai trò xếp vừa đủ hàng 4 cột. */
  h+='<div class="kpis">'+cfg.kpis.map(function(k){return K[k](k==="tong"&&(ME.role==="QUAN_LY"||ME.role==="QA"))}).join("")+'</div>';
  var alerts="",n=0;
  cfg.warn.forEach(function(w){
   if(w==="het")d.expiring.forEach(function(l){n++;alerts+='<div class="alert warn">'+ic("clock")+'<div><b>Lô '+esc(l.code)+' sắp hết hạn</b><div class="small">Còn '+l.days_left+' ngày ('+dt(l.expiry_date)+'), tồn '+num(l.qty_kg)+' kg. Nên xuất trước (FEFO).</div></div></div>'});
   if(w==="held")d.held.forEach(function(l){n++;alerts+='<div class="alert bad">'+ic("alert")+'<div><b>Lô '+esc(l.code)+': '+QA[l.qa_status][0].toLowerCase()+'</b><div class="small">'+num(l.qty_kg)+' kg chưa được phép bán.</div></div></div>'});
   if(w==="near")(d.near_arrival||[]).forEach(function(x){n++;alerts+='<div class="alert warn" style="background:#FFF6D6">'+ic("clock")+'<div><b>Xe '+esc(x.code)+' sắp đến kho ('+x.progress+'%)</b><div class="small">'+esc(x.product)+' '+num(x.kg)+' kg · '+esc(x.plate)+' · dự kiến '+dt(x.eta)+'. Chuẩn bị bến bãi, cân đo và kiểm định.</div></div></div>'});
   if(w==="temp")(d.temp_alerts||[]).concat(d.lost_signal||[]).forEach(function(x){n++;alerts+='<div class="alert bad">'+ic("alert")+'<div><b>Xe '+esc(x.code)+(x.lost?"":": nhiệt độ thùng xe vượt ngưỡng")+'</b><div class="small">'+esc(x.product)+' '+num(x.kg)+' kg · '+esc(x.plate)+'. Kiểm tra ngay ở tab Vận chuyển.</div></div></div>'});
   if(w==="min")d.products.forEach(function(p){if(p.available<p.min_stock){n++;alerts+='<div class="alert warn">'+ic("alert")+'<div><b>'+esc(p.name)+' dưới ngưỡng an toàn</b><div class="small">Khả dụng '+num(p.available)+' kg, tối thiểu '+num(p.min_stock)+' kg.</div></div></div>'}});
  });
  var alertTitle=ME.role==="QA"?"Cảnh báo chất lượng":ME.role==="THU_KHO"?"Cảnh báo FEFO":"Cảnh báo";
  var emptyMsg=ME.role==="QA"?"Lô nào bị cách ly, không đạt hoặc chờ kiểm định sẽ hiện ở đây.":"Lô nào sắp hết hạn hoặc bị giữ lại sẽ hiện ở đây.";
  var ac='<div class="card"><h2>'+alertTitle+'</h2>'+(n?alerts:emptyBox("Không có cảnh báo",emptyMsg))+'</div>';
  if(cfg.chart){
   var mx=Math.max.apply(null,d.products.map(function(p){return Math.max(p.available,p.min_stock)}))||1;
   h+='<div class="grid g2">'+ac+'<div class="card"><h2>Tồn khả dụng theo mặt hàng</h2>'+d.products.map(function(p){return '<div class="hb"><span>'+esc(p.name)+'</span><div class="bar '+(p.available<p.min_stock?"warn":"")+'"><i style="width:'+(p.available/mx*100).toFixed(1)+'%"></i></div><b>'+num(p.available)+' kg</b></div>'}).join("")+'</div></div>';
  }else h+=ac;
  if(cfg.wh){
   h+='<div class="card"><h2>Kho và sức chứa</h2><div class="grid g4">'+d.warehouses.map(function(w){var pc=w.used/w.capacity_kg*100;return '<div class="wh"><b>'+esc(w.name)+'</b> <span class="muted small">'+esc(w.city)+'</span><div class="pct">'+pc.toFixed(0)+'%</div><div class="bar '+(pc>85?"bad":pc>70?"warn":"")+'" style="margin:6px 0"><i style="width:'+pc.toFixed(1)+'%"></i></div><div class="small muted">'+num(w.used)+' / '+num(w.capacity_kg)+' kg · giữ '+w.temp_min+'–'+w.temp_max+'°C</div></div>'}).join("")+'</div></div>';
  }
  return h});}

function spark(se){
  if(!se||se.length<2)return "";
  var mn=Math.min.apply(null,se.map(function(x){return x.p})),mx=Math.max.apply(null,se.map(function(x){return x.p})),r=(mx-mn)||1;
  var pts=se.map(function(x,i){return (i/(se.length-1)*112+4).toFixed(1)+","+(30-(x.p-mn)/r*26).toFixed(1)});
  var lp=pts[pts.length-1].split(",");
  return '<svg class="spark" viewBox="0 0 120 34" role="img" aria-label="Biểu đồ giá '+se.length+' ngày"><polyline points="'+pts.join(" ")+'"/><circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="3.5"/></svg>';
}

function photoFiles(files){return Promise.all(Array.prototype.map.call(files,function(f){return new Promise(function(ok,no){
  if(!/^image\//.test(f.type))return no(new Error("Chỉ nhận file ảnh"));
  var fr=new FileReader();fr.onerror=function(){no(new Error("Không đọc được ảnh"))};
  fr.onload=function(){var im=new Image();im.onerror=function(){no(new Error("Ảnh không hợp lệ"))};
   im.onload=function(){var k=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL("image/jpeg",0.8))};im.src=fr.result};
  fr.readAsDataURL(f)})}))}
