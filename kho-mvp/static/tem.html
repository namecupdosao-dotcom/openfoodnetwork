<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>In tem QR · Kho Nông Sản Xanh</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#12261B;--muted:#56685C;--lime:#C8F03C;--line:#DCE5D3}
*{box-sizing:border-box}
body{margin:0;background:#F3F6EE;color:var(--ink);font:15px/1.4 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:var(--lime);border-bottom:2px solid var(--ink)}
.bar h1{margin:0;font-size:18px;font-weight:800;flex:1;min-width:180px}
.bar label{font-weight:600;font-size:14px}
select,button{font:inherit;font-weight:600;border:2px solid var(--ink);border-radius:99px;padding:7px 16px;background:#fff;color:var(--ink);cursor:pointer;min-height:40px}
button.pri{background:var(--ink);color:var(--lime)}
.hint{max-width:760px;margin:14px auto 0;padding:0 20px;color:var(--muted);font-size:13.5px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,64mm);gap:4mm;justify-content:center;padding:18px}
.lbl{width:64mm;height:40mm;background:#fff;border:1px dashed #9db3a3;border-radius:2mm;padding:2.5mm;display:grid;grid-template-columns:30mm 1fr;gap:2.5mm;align-items:center;break-inside:avoid;color:#000}
.lbl svg{width:30mm;height:30mm;display:block}
.lbl .n{font-weight:800;font-size:10.5pt;line-height:1.15}
.lbl .c{font:700 8.5pt ui-monospace,Menlo,Consolas,monospace;margin:1mm 0}
.lbl .d{font-size:7.5pt;line-height:1.3}
.lbl .q{font-size:6.8pt;margin-top:1.2mm;font-weight:600}
.err{max-width:480px;margin:40px auto;text-align:center;padding:0 20px}
@media print{.bar,.hint{display:none}body{background:#fff}.sheet{padding:0;gap:3mm;justify-content:start}.lbl{border:1px solid #bbb}@page{margin:8mm}}
</style>
</head>
<body>
<div class="bar"><h1>In tem QR truy xuất</h1><label>Số tem <select id="n"><option>1</option><option>4</option><option selected>8</option><option>12</option><option>24</option></select></label><button class="pri" id="pr" type="button">In tem</button></div>
<p class="hint">Mỗi tem chứa mã QR dẫn tới trang truy xuất công khai của lô. Khi in, chọn khổ A4 hoặc giấy decal, tỉ lệ 100% (không "Fit to page"), tắt tiêu đề và chân trang của trình duyệt.</p>
<div class="sheet" id="sheet"></div>
<script>
(function(){
var q=new URLSearchParams(location.search),c=q.get("c")||"",k=q.get("k")||"",sh=q.get("s")||"",od=q.get("order")||"",sheet=document.getElementById("sheet"),sel=document.getElementById("n");
function dmy(s){var p=String(s||"").slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:"–"}
function t(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function fail(m){var d=t("div","err",m);sheet.replaceChildren(d)}
fetch("/api/public/lot?c="+encodeURIComponent(c)+"&k="+encodeURIComponent(k)+(sh?"&s="+encodeURIComponent(sh):"")+(od?"&order="+encodeURIComponent(od):""),{cache:"no-store"}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Lỗi");return j})}).then(function(d){
  var src="/qr.svg?c="+encodeURIComponent(c)+"&k="+encodeURIComponent(k)+(sh?"&s="+encodeURIComponent(sh):"")+(od?"&order="+encodeURIComponent(od):"")+"&base="+encodeURIComponent(location.origin);
  fetch(src).then(function(r){if(!r.ok)throw new Error("Không tạo được mã QR");return r.text()}).then(function(svg){
    function draw(){
      var n=+sel.value,out=[];
      for(var i=0;i<n;i++){
        var l=t("div","lbl"),qr=t("div");qr.innerHTML=svg; /* svg do máy chủ sinh ra từ mã đã xác thực */
        var b=t("div");b.appendChild(t("div","n",d.product));b.appendChild(t("div","c",d.code));
        b.appendChild(t("div","d","Thu hoạch "+dmy(d.harvest_date)));b.appendChild(t("div","d","HSD "+dmy(d.expiry_date)));
        b.appendChild(t("div","d",d.farm.name));if(d.shipment)b.appendChild(t("div","d","Chuyến "+d.shipment));b.appendChild(t("div","q","Quét QR xem nguồn gốc"));
        l.appendChild(qr);l.appendChild(b);out.push(l);
      }
      sheet.replaceChildren.apply(sheet,out);
    }
    sel.onchange=draw;draw();
  }).catch(function(e){fail(e.message)});
}).catch(function(e){fail("Không in được tem: "+e.message)});
document.getElementById("pr").onclick=function(){window.print()};
})();
</script>
</body>
</html>
